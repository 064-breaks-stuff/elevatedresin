    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17899719659"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'AW-17899719659');
    </script>

    <!-- Event snippet for Click to call conversion page
    In your html page, add the snippet and call gtag_report_conversion when someone clicks on the chosen link or button. -->
    <script>
      function gtag_report_conversion(url) {
        var callback = function () {
          if (typeof(url) != 'undefined') {
            window.location = url;
          }
        };
        gtag('event', 'conversion', {
          'send_to': 'AW-17899719659/S_OOCIGdhqUdEOuXoNdC',
          'value': 1.0,
          'currency': 'USD',
          'event_callback': callback
        });
        return false;
      }
    </script>

    <script>
      // Add the requested onclick attribute to phone links rendered by React.
      document.addEventListener('DOMContentLoaded', function () {
        function attachPhoneHandler(root) {
          if (root.nodeType !== 1) return;
          if (root.matches('a[href^="tel:"]')) {
            root.setAttribute('onclick', 'return gtag_report_conversion(this.href);');
          }
          root.querySelectorAll('a[href^="tel:"]').forEach(function (link) {
            link.setAttribute('onclick', 'return gtag_report_conversion(this.href);');
          });
        }

        attachPhoneHandler(document.body);
        var observer = new MutationObserver(function (records) {
          records.forEach(function (record) {
            record.addedNodes.forEach(attachPhoneHandler);
          });
        });
        observer.observe(document.body, { childList: true, subtree: true });
      });
    </script>
